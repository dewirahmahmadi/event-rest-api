name: Build and Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  DOCKER_IMAGE: event-ticketing
  CONTAINER_NAME: event-ticketing-api

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore EventTicketing/EventTicketing.csproj

      - name: Build
        run: dotnet build EventTicketing/EventTicketing.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal || true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:latest -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} -f EventTicketing/Dockerfile .

      - name: Save Docker image
        run: |
          docker save ${{ env.DOCKER_IMAGE }}:latest | gzip > image.tar.gz

      - name: Copy image to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          source: "image.tar.gz"
          target: "/tmp"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
          JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          envs: DB_CONNECTION_STRING,JWT_SECRET,JWT_ISSUER,JWT_AUDIENCE,SUPABASE_URL,SUPABASE_KEY
          script: |
            # Load the Docker image
            docker load < /tmp/image.tar.gz

            # Stop and remove existing container if it exists
            docker stop ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            docker rm ${{ env.CONTAINER_NAME }} 2>/dev/null || true

            # Create env file for Docker (handles special characters safely)
            cat > /tmp/app.env << 'ENVEOF'
            ASPNETCORE_ENVIRONMENT=Production
            ASPNETCORE_URLS=http://+:5000
            ENVEOF

            # Append secrets using printf to handle special characters
            printf 'ConnectionStrings__DefaultConnection=%s\n' "$DB_CONNECTION_STRING" >> /tmp/app.env
            printf 'Jwt__Secret=%s\n' "$JWT_SECRET" >> /tmp/app.env
            printf 'Jwt__Issuer=%s\n' "$JWT_ISSUER" >> /tmp/app.env
            printf 'Jwt__Audience=%s\n' "$JWT_AUDIENCE" >> /tmp/app.env
            printf 'Supabase__Url=%s\n' "$SUPABASE_URL" >> /tmp/app.env
            printf 'Supabase__Key=%s\n' "$SUPABASE_KEY" >> /tmp/app.env

            # Run the new container with env file
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              -p 5000:5000 \
              --env-file /tmp/app.env \
              ${{ env.DOCKER_IMAGE }}:latest

            # Clean up sensitive files
            rm /tmp/image.tar.gz
            rm /tmp/app.env

            # Remove old images
            docker image prune -f

            # Verify deployment
            sleep 5
            docker ps | grep ${{ env.CONTAINER_NAME }}